<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2B1046"/>
      <stop offset="100%" stop-color="#0C0813"/>
    </radialGradient>
    <linearGradient id="up" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22E88F"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable (OS clips to shape) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <text x="256" y="230" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',sans-serif"
        font-size="72" font-weight="900" letter-spacing="6" fill="#38BDF8">SQUABBLE</text>
  <text x="256" y="410" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',sans-serif"
        font-size="220" font-weight="900" letter-spacing="12" fill="url(#up)">UP</text>
</svg>
